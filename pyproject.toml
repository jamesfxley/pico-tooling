[project]
name = "pico-tooling"
version = "0.2.3"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pico_tooling"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["house", "."]
markers = [
    "real_sdk: configures firmware against a real Pico SDK and ARM toolchain",
]
